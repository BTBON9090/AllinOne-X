<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All in One · 六套皮肤</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F1F0EB;color:#17161B;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{width:900px;margin:0 auto;padding:40px 44px 48px}
  .kicker{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:9px;letter-spacing:.14em;color:#8C887E;text-transform:uppercase}
  h1{font-size:34px;line-height:1.12;letter-spacing:-.03em;margin:10px 0 8px;font-weight:650}
  .lead{font-size:11px;line-height:1.8;color:#625F57;margin:0 0 24px;max-width:620px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 20px}
  .shot{min-width:0}
  .shot img{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 18px 36px -24px rgba(24,20,30,.4),0 0 0 1px rgba(24,20,30,.08)}
  .label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px}
  .label b{font-size:11px;letter-spacing:-.01em}
  .label span{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:7.5px;letter-spacing:.1em;color:#8C887E}
  .foot{display:flex;justify-content:space-between;gap:20px;margin-top:26px;padding-top:14px;border-top:1px solid #D8D5CC;font-size:9.5px;line-height:1.7;color:#77736A}
  .foot b{color:#3B3933;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">ALL IN ONE / SKINS</div>
  <h1>六套皮肤，默认卡片</h1>
  <p class="lead">设置 → 插件皮肤。选择后即时生效，保存在本地。六套都覆盖深浅主题与 360 × 520 精简窗口。</p>
  <div class="grid">
    <div class="shot"><img src="home-cards.png" alt="卡片皮肤"><div class="label"><b>卡片</b><span>CARDS / DEFAULT</span></div></div>
    <div class="shot"><img src="home-dark-rail.png" alt="暗轨皮肤"><div class="label"><b>暗轨</b><span>DARK RAIL</span></div></div>
    <div class="shot"><img src="home-porcelain.png" alt="白瓷皮肤"><div class="label"><b>白瓷</b><span>PORCELAIN</span></div></div>
    <div class="shot"><img src="home-index.png" alt="索引皮肤"><div class="label"><b>索引</b><span>INDEX</span></div></div>
    <div class="shot"><img src="home-blocks.png" alt="区块皮肤"><div class="label"><b>区块</b><span>BLOCKS</span></div></div>
    <div class="shot"><img src="home-soft.png" alt="柔光皮肤"><div class="label"><b>柔光</b><span>SOFT TACTILE</span></div></div>
  </div>
  <div class="foot"><span><b>边界：</b>保留 15 个入口、22 个工具、现有流程与宿主通信。</span><span>440 × 600 · LIGHT · DEFAULT CARDS</span></div>
</div>
</body>
</html>
